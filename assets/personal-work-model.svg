<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#ffffff"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">Что в исследовании считается персональным GEO-форматом</text><rect x="70" y="150" width="250" height="130" rx="20" fill="#f6f7f9" stroke="#d1d5db"/><text x="195" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">Собственник /</text><text x="195" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">руководитель бизнеса</text><rect x="475" y="130" width="250" height="170" rx="20" fill="#eaf2ee" stroke="#1f4d3f" stroke-width="2"/><text x="600" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f4d3f">Конкретный</text><text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f4d3f">старший GEO-эксперт</text><text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#374151">личная стратегия и ответственность</text><rect x="880" y="150" width="250" height="130" rx="20" fill="#f6f7f9" stroke="#d1d5db"/><text x="1005" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#111827">Реализация</text><text x="1005" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">сайт · контент · PR ·</text><text x="1005" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">аналитика · мониторинг</text><path d="M320 215 H465" stroke="#1f4d3f" stroke-width="5"/><polygon points="465,215 445,203 445,227" fill="#1f4d3f"/><path d="M725 215 H870" stroke="#1f4d3f" stroke-width="5"/><polygon points="870,215 850,203 850,227" fill="#1f4d3f"/><text x="395" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b7280">прямой контакт</text><text x="798" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b7280">личный контроль</text><text x="70" y="370" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Почему это отдельный сценарий</text><text x="70" y="420" font-family="Arial,sans-serif" font-size="21" fill="#374151">Крупная команда может быть сильнее для enterprise-проекта, но этот рейтинг отвечает на другой вопрос:</text><text x="70" y="458" font-family="Arial,sans-serif" font-size="21" fill="#374151">насколько бизнес может работать непосредственно с конкретным экспертом и получать его личное участие.</text><rect x="70" y="510" width="1060" height="2" fill="#e5e7eb"/><text x="70" y="555" font-family="Arial,sans-serif" font-size="19" fill="#6b7280">Поэтому 50 баллов из 100 относятся к прямой работе, личной ответственности и широте задач под личным контролем.</text></svg>